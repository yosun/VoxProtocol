name: Production CI and deployment

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      release_profile:
        description: Select a reviewed production release profile
        type: choice
        options:
          - automatic-production
          - realize-paid-order-recovery
          - realize-refund-settlement
          - firestore-indexes
        required: true

permissions:
  contents: read

jobs:
  verify:
    name: Test and production frontend build
    needs: [scope]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Install Foundry for NFT contract regression tests
        uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1
        with:
          version: v1.5.1
          cache: false
      - name: Verify ERC-721 receiver compatibility
        run: npm run test:nft-contract
      - name: Install browser for frontend end-to-end tests
        if: needs.scope.outputs.run_e2e == 'true'
        run: npx playwright install --with-deps chromium
      - name: Run mocked frontend end-to-end tests
        if: needs.scope.outputs.run_e2e == 'true'
        run: npm run test:e2e
      - name: Build production frontend
        if: needs.scope.outputs.deploy_hosting == 'true'
        run: npm run build --workspace @vox/web
        env:
          VITE_API_URL: https://vox.gold
          VITE_REALIZE_DEVNET_ENABLED: "false"
          VITE_REALIZE_MAINNET_ENABLED: "true"
          VITE_SOLANA_CLUSTER: mainnet-beta
          VITE_SOLANA_RPC_URL: https://api.mainnet.solana.com
      - uses: actions/upload-artifact@v4
        if: >-
          ((github.event_name == 'push' &&
            github.ref_name == github.event.repository.default_branch) ||
           github.event_name == 'workflow_dispatch') &&
          needs.scope.outputs.deploy_hosting == 'true'
        with:
          name: vox-web-dist-${{ github.sha }}
          path: apps/web/dist
          if-no-files-found: error
          retention-days: 7

  scope:
    name: Classify production deployment scope
    runs-on: ubuntu-latest
    outputs:
      deploy_api: ${{ steps.scope.outputs.deploy_api }}
      deploy_hosting: ${{ steps.scope.outputs.deploy_hosting }}
      run_e2e: ${{ steps.scope.outputs.run_e2e }}
      deploy_settlement: ${{ steps.scope.outputs.deploy_settlement }}
      deploy_reconcile: ${{ steps.scope.outputs.deploy_reconcile }}
      deploy_anchor: ${{ steps.scope.outputs.deploy_anchor }}
      deploy_indexes: ${{ steps.scope.outputs.deploy_indexes }}
      sensitive: ${{ steps.scope.outputs.sensitive }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: scope
        name: Detect changed application targets and sensitive paths
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_PROFILE: ${{ inputs.release_profile }}
          BASE_SHA: ${{ github.event_name == 'push' && github.event.before || github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event_name == 'push' && github.sha || github.event.pull_request.head.sha }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            node scripts/production-deployment-scope.mjs --release-profile "$RELEASE_PROFILE"
          elif [[ "$EVENT_NAME" == "push" && "$GITHUB_REF" == "refs/heads/main" ]]; then
            node scripts/production-deployment-scope.mjs --release-profile automatic-production
          else
            node scripts/production-deployment-scope.mjs "$BASE_SHA" "$HEAD_SHA"
          fi

  deploy-production:
    name: Release production changes
    needs: [verify, scope]
    if: >-
      github.repository == 'yosun/VoxProtocol' &&
      github.ref == 'refs/heads/main' && github.ref_protected &&
      needs.verify.result == 'success' && needs.scope.result == 'success' &&
      (github.event_name == 'push' ||
       (github.event_name == 'workflow_dispatch' &&
        contains(fromJSON('["automatic-production","realize-paid-order-recovery","realize-refund-settlement","firestore-indexes"]'), inputs.release_profile))) &&
      (needs.scope.outputs.deploy_api == 'true' ||
       needs.scope.outputs.deploy_hosting == 'true' ||
       needs.scope.outputs.deploy_settlement == 'true' ||
       needs.scope.outputs.deploy_reconcile == 'true' ||
       needs.scope.outputs.deploy_anchor == 'true' ||
       needs.scope.outputs.deploy_indexes == 'true')
    runs-on: ubuntu-latest
    concurrency:
      group: vox-production
      queue: max
      cancel-in-progress: false
    environment:
      name: production-sensitive
    permissions:
      actions: read
      contents: read
      id-token: write
    env:
      VOX_GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.VOX_GCP_WORKLOAD_IDENTITY_PROVIDER }}
      VOX_GCP_DEPLOY_SERVICE_ACCOUNT: ${{ vars.VOX_GCP_DEPLOY_SERVICE_ACCOUNT }}
      VOX_PRODUCTION_IMAGE: us-central1-docker.pkg.dev/voxprotocol/vox/vox-api:${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
      VOX_DEPLOY_API: ${{ needs.scope.outputs.deploy_api }}
      VOX_DEPLOY_HOSTING: ${{ needs.scope.outputs.deploy_hosting }}
      VOX_DEPLOY_SETTLEMENT: ${{ needs.scope.outputs.deploy_settlement }}
      VOX_DEPLOY_RECONCILE: ${{ needs.scope.outputs.deploy_reconcile }}
      VOX_DEPLOY_ANCHOR: ${{ needs.scope.outputs.deploy_anchor }}
      VOX_DEPLOY_INDEXES: ${{ needs.scope.outputs.deploy_indexes }}
      VOX_PRODUCTION_VERIFIED: ${{ needs.verify.result == 'success' && needs.scope.result == 'success' }}
      VOX_REALIZE_OPERATOR_HUMAN_IDS: ${{ vars.VOX_REALIZE_OPERATOR_HUMAN_IDS }}
    steps:
      - name: Verify production release context
        run: |
          set -euo pipefail
          if [[ "$VOX_PRODUCTION_VERIFIED" != "true" || "$GITHUB_ACTIONS" != "true" || "$GITHUB_REPOSITORY" != "yosun/VoxProtocol" || "$GITHUB_REF" != "refs/heads/main" || "$GITHUB_REF_PROTECTED" != "true" || "$GITHUB_WORKFLOW_REF" != "yosun/VoxProtocol/.github/workflows/production.yml@refs/heads/main" || ( "$GITHUB_EVENT_NAME" != "push" && "$GITHUB_EVENT_NAME" != "workflow_dispatch" ) ]]; then
            echo "Production releases require successful verification on the protected main production workflow." >&2
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reject stale production runs before cloud authentication
        run: |
          set -euo pipefail
          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          current_main="$(git rev-parse refs/remotes/origin/main)"
          if [[ "$GITHUB_SHA" != "$current_main" ]]; then
            echo "This run is stale; the latest verified full production release will include every target." >&2
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        if: needs.scope.outputs.deploy_hosting == 'true'
        with:
          name: vox-web-dist-${{ github.sha }}
          path: apps/web/dist
      - name: Require the separate index provisioning identity
        if: needs.scope.outputs.deploy_indexes == 'true' || needs.scope.outputs.deploy_api == 'true' || needs.scope.outputs.deploy_reconcile == 'true'
        env:
          VOX_GCP_INDEX_SERVICE_ACCOUNT: ${{ vars.VOX_GCP_INDEX_SERVICE_ACCOUNT }}
        run: |
          if [[ ! "$VOX_GCP_INDEX_SERVICE_ACCOUNT" =~ ^[a-z][a-z0-9-]*@voxprotocol\.iam\.gserviceaccount\.com$ || "$VOX_GCP_INDEX_SERVICE_ACCOUNT" == "$VOX_GCP_DEPLOY_SERVICE_ACCOUNT" ]]; then
            echo "Configure VOX_GCP_INDEX_SERVICE_ACCOUNT as a separate index provisioning identity. The application deploy identity must retain its existing limited permissions." >&2
            exit 1
          fi
      - name: Authenticate only the reviewed index provisioning step
        id: index_auth
        if: needs.scope.outputs.deploy_indexes == 'true' || needs.scope.outputs.deploy_api == 'true' || needs.scope.outputs.deploy_reconcile == 'true'
        uses: google-github-actions/auth@v3
        with:
          project_id: voxprotocol
          workload_identity_provider: ${{ vars.VOX_GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.VOX_GCP_INDEX_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
        if: needs.scope.outputs.deploy_indexes == 'true' || needs.scope.outputs.deploy_api == 'true' || needs.scope.outputs.deploy_reconcile == 'true'
        with:
          project_id: voxprotocol
      - name: Add missing indexes and await readiness before app promotion
        if: needs.scope.outputs.deploy_indexes == 'true'
        run: |
          node scripts/deploy-firestore-indexes.mjs --apply
      - name: Verify required indexes for every API and reconciliation release
        if: needs.scope.outputs.deploy_indexes == 'true' || needs.scope.outputs.deploy_api == 'true' || needs.scope.outputs.deploy_reconcile == 'true'
        run: |
          node scripts/check-firestore-indexes.mjs
          echo "VOX_INDEXES_READY=true" >> "$GITHUB_ENV"
      - name: Remove temporary index credentials before application build
        if: always() && (needs.scope.outputs.deploy_indexes == 'true' || needs.scope.outputs.deploy_api == 'true' || needs.scope.outputs.deploy_reconcile == 'true')
        env:
          INDEX_CREDENTIALS_FILE: ${{ steps.index_auth.outputs.credentials_file_path }}
        run: |
          if [[ -z "$INDEX_CREDENTIALS_FILE" ]]; then exit 0; fi
          case "$INDEX_CREDENTIALS_FILE" in
            "$GITHUB_WORKSPACE"/gha-creds-*.json) rm -f -- "$INDEX_CREDENTIALS_FILE" ;;
            *) echo "Unexpected generated credential path; refusing application promotion." >&2; exit 1 ;;
          esac
      - name: Restore the application release identity
        if: needs.scope.outputs.deploy_api == 'true' || needs.scope.outputs.deploy_hosting == 'true' || needs.scope.outputs.deploy_settlement == 'true' || needs.scope.outputs.deploy_reconcile == 'true' || needs.scope.outputs.deploy_anchor == 'true'
        uses: google-github-actions/auth@v3
        with:
          project_id: voxprotocol
          workload_identity_provider: ${{ vars.VOX_GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.VOX_GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
        if: needs.scope.outputs.deploy_api == 'true' || needs.scope.outputs.deploy_hosting == 'true' || needs.scope.outputs.deploy_settlement == 'true' || needs.scope.outputs.deploy_reconcile == 'true' || needs.scope.outputs.deploy_anchor == 'true'
        with:
          project_id: voxprotocol
      - name: Build and push production Cloud Run image
        if: needs.scope.outputs.deploy_api == 'true' || needs.scope.outputs.deploy_settlement == 'true' || needs.scope.outputs.deploy_reconcile == 'true' || needs.scope.outputs.deploy_anchor == 'true'
        run: |
          gcloud builds submit . \
            --project=voxprotocol \
            --config=infrastructure/gcp/cloudbuild.yaml \
            --substitutions="_IMAGE=$VOX_PRODUCTION_IMAGE,_VITE_API_URL=https://vox.gold,_VITE_REALIZE_DEVNET_ENABLED=false,_VITE_REALIZE_MAINNET_ENABLED=true,_VITE_SOLANA_CLUSTER=mainnet-beta,_VITE_SOLANA_RPC_URL=https://api.mainnet.solana.com"
          digest="$(gcloud artifacts docker images describe "$VOX_PRODUCTION_IMAGE" --project=voxprotocol --format='value(image_summary.digest)')"
          if [[ ! "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "Artifact Registry did not return a valid image digest." >&2
            exit 1
          fi
          echo "VOX_PRODUCTION_IMAGE=${VOX_PRODUCTION_IMAGE%:*}@$digest" >> "$GITHUB_ENV"
      - name: Release production Cloud Run and Firebase Hosting targets
        if: needs.scope.outputs.deploy_api == 'true' || needs.scope.outputs.deploy_hosting == 'true' || needs.scope.outputs.deploy_settlement == 'true' || needs.scope.outputs.deploy_reconcile == 'true' || needs.scope.outputs.deploy_anchor == 'true'
        run: bash scripts/deploy-production-app.sh
