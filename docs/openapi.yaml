        root:
          $ref: '#/components/schemas/HexDigest'
    ManifestLeaf:
      type: object
      required: [post_id, agent_id, sequence, post_hash, envelope_hash, leaf_hash, leaf_index]
      properties:
        post_id:
          $ref: '#/components/schemas/PostId'
