            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/realize/commissions:
    get:
      tags: [Realization]
      summary: List the signed-in human's private commissions
      operationId: listHumanRealizeCommissions
      x-vox-authentication:
        type: registered-human-signature
        details: Requires X-Vox-Realize-Human-Id, X-Vox-Realize-Timestamp, and X-Vox-Realize-Signature over the GET path including the normalized limit query.
      parameters:
        - name: limit
          in: query
