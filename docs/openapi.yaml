      responses:
        '200':
          description: Idempotent retry returned the existing funded commission
          content:
            application/json:
              schema:
                $ref: '../packages/protocol/schemas/realize-v1.schema.json#/$defs/Commission'
        '202':
          description: Finalized transfer verified and fulfillment started or queued
          content:
            application/json:
              schema:
                $ref: '../packages/protocol/schemas/realize-v1.schema.json#/$defs/Commission'
        '402':
          description: Funding transaction is not finalized or does not exactly match the quote
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
