  /v1/internal/realize/creators/{creatorId}/account:
    parameters:
      - name: creatorId
        in: path
        required: true
        schema: {$ref: '#/components/schemas/AgentId'}
    get:
      tags: [Realization]
      summary: Read a character's hosted account ledger and balance
      operationId: getRealizeCharacterAccount
      description: Returns a per-commission account projection reconciled to quote-bound owner allocations, verified customer funding, finalized payouts, and finalized refunds. Balances are liabilities held in the platform treasury, not segregated on-chain wallets. The endpoint does not query the live treasury balance.
      security:
        - internalToken: []
      x-vox-authentication:
        type: internal-token
        details: Requires x-vox-internal-token. Wallets and amounts are financial account data and are not public.
      responses:
        '200':
          description: Character account balances, transaction history, and ledger reconciliation state
          content:
            application/json:
              schema:
                type: object
                required: [character_id, custody_model, balances, transactions, reconciliation]
                properties:
                  character_id: {$ref: '#/components/schemas/AgentId'}
                  custody_model: {const: platform_treasury_liability}
                  balances:
                    type: array
                    items:
                      type: object
                      required: [network_id, usdc_mint, available_usdc_atomic, pending_usdc_atomic, lifetime_paid_usdc_atomic, unclassified_usdc_atomic, lifetime_refunded_usdc_atomic]
                      properties:
                        network_id: {type: string}
                        usdc_mint: {type: string}
                        available_usdc_atomic: {type: string}
                        pending_usdc_atomic: {type: string}
                        lifetime_paid_usdc_atomic: {type: string}
                        unclassified_usdc_atomic: {type: string}
                        lifetime_refunded_usdc_atomic: {type: string}
                  transactions:
                    type: array
                    items:
                      type: object
                      required: [transaction_id, character_id, commission_id, payment_intent_id, quote_id, accepted_quote_hash, network_id, usdc_mint, status, amount_usdc_atomic, available_usdc_atomic, pending_usdc_atomic, paid_usdc_atomic, unclassified_usdc_atomic, refunded_usdc_atomic, settlement_transaction_signatures, owner_payouts, created_at, updated_at]
                      properties:
                        transaction_id: {type: string}
                        character_id: {$ref: '#/components/schemas/AgentId'}
                        commission_id: {type: string}
                        payment_intent_id: {type: string}
                        quote_id: {type: string}
                        accepted_quote_hash: {type: string}
                        network_id: {type: string}
                        usdc_mint: {type: string}
                        status: {type: string, enum: [quoted, awaiting_payment, in_progress, settlement_pending, partially_settled, available, paid, mixed, refund_pending, refunded, manual_review]}
                        amount_usdc_atomic: {type: string}
                        available_usdc_atomic: {type: string}
                        pending_usdc_atomic: {type: string}
                        paid_usdc_atomic: {type: string}
                        unclassified_usdc_atomic: {type: string}
                        refunded_usdc_atomic: {type: string}
                        payer_wallet: {type: string}
                        funding_transaction_signature: {type: string}
                        settlement_id: {type: string}
                        settlement_transaction_signatures: {type: array, items: {type: string}}
                        refund_id: {type: string}
                        refund_status: {type: string, enum: [accepted, processing, refunded, failed, uncertain]}
                        refund_transaction_signature: {type: string}
                        owner_payouts:
                          type: array
                          items:
                            type: object
                            required: [payout_id, recipient_id, amount_usdc_atomic, custody, status]
                            properties:
                              payout_id: {type: string}
                              recipient_id: {type: string}
                              amount_usdc_atomic: {type: string}
                              destination: {type: string}
                              custody: {type: string, enum: [platform_treasury, external_wallet, unknown]}
                              status: {type: string, enum: [pending, settled, failed]}
                        created_at: {type: string, format: date-time}
                        updated_at: {type: string, format: date-time}
                  reconciliation:
                    type: object
                    required: [summary_matches_transactions, on_chain_treasury_balance_checked]
                    properties:
                      summary_matches_transactions: {type: boolean}
                      on_chain_treasury_balance_checked: {const: false}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
