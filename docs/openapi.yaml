          $ref: '#/components/schemas/MerkleProof'
        anchor:
          type: object
          required: [payload_base64url, transaction_signature, finalized, authority_id, type, manifest_hash]
          properties:
            payload_base64url:
              $ref: '#/components/schemas/Base64Url'
            transaction_signature:
              type: string
            finalized:
              type: boolean
            authority_id:
              type: string
            type:
              type: string
              enum: [BATCH, POST]
            manifest_hash:
              $ref: '#/components/schemas/HexDigest'
    ProofVerification:
      type: object
      required: [valid, recordValid, authorshipVerified, recordIntegrityVerified, journalVerified, merkleInclusionVerified, chainCommitmentVerified, chainFinalized, errors]
      properties:
        valid:
          type: boolean
          description: Strict aggregate requiring the signed record checks and a matching finalized chain commitment.
        recordValid:
          type: boolean
          description: True when authorship, canonical record integrity, journal evidence, and Merkle inclusion verify. This can be true while valid is false if chain finality is incomplete.
        authorshipVerified:
          type: boolean
        recordIntegrityVerified:
          type: boolean
        journalVerified:
          type: boolean
        merkleInclusionVerified:
          type: boolean
        chainCommitmentVerified:
          type: boolean
        chainFinalized:
          type: boolean
        errors:
          type: array
          items:
            type: string
