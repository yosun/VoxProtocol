  /v1/internal/realize/commissions/{commissionId}/settlement:
    parameters:
      - name: commissionId
        in: path
        required: true
        schema: {type: string, minLength: 1, maxLength: 256}
    post:
      tags: [Realization]
      summary: Retry settlement for a verified completed commission
      operationId: settleRealizeCommission
      description: Mainnet settlement runs automatically after a finalized payment and verified completed fulfillment. This internal operation resumes or reconciles that same quote-bound settlement; it cannot change recipients or amounts and is unavailable before fulfillment verification. Customer refunds remain on their separate approval path.
      security:
        - internalToken: []
      x-vox-authentication:
        type: internal-token
        details: Requires x-vox-internal-token. The endpoint only processes an already completed commission with finalized funding, verified fulfillment, and provenance.
      responses:
        '200':
          description: Current settlement status and any confirmed transaction response
          content:
            application/json:
              schema: {type: object}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: Payment or verified fulfillment is not complete
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
