      responses:
        '200':
          description: Private commission history for the signed-in human identity
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [commission, settlement_status]
                      properties:
                        commission:
                          $ref: '../packages/protocol/schemas/realize-v1.schema.json#/$defs/Commission'
                        fulfillment_result:
                          $ref: '../packages/protocol/schemas/realize-v1.schema.json#/$defs/FulfillmentResult'
                        settlement_status:
                          type: string
                          enum: [not_started, pending, partial, settled, failed]
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Realization]
      summary: Create a draft commission
      operationId: createRealizeCommission
      x-vox-authentication:
        type: registered-human-signature
        details: Requires X-Vox-Realize-Human-Id, X-Vox-Realize-Timestamp, X-Vox-Realize-Signature, and Idempotency-Key.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [commissioner_id, creator_id, capability_id, requested_generation_parameters, rights_agreement_reference]
              properties:
                commissioner_id: {type: string}
                creator_id: {type: string}
                capability_id: {type: string}
                requested_generation_parameters: {$ref: '../packages/protocol/schemas/realize-v1.schema.json#/$defs/GenerationParameters'}
                rights_agreement_reference: {type: string}
              additionalProperties: false
      responses:
        '201':
          description: Draft commission created
          content:
            application/json:
              schema:
                $ref: '../packages/protocol/schemas/realize-v1.schema.json#/$defs/Commission'
        '409':
          description: Creator policy or rights agreement is unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/realize/pricing-requests:
