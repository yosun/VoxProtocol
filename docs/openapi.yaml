        required: true
        schema:
          type: string
    post:
      tags: [Realization]
      summary: Verify finalized USDC funding and begin production fulfillment
      operationId: fundRealizeCommission
      x-vox-authentication:
        type: registered-human-signature
        details: The commissioner signs the declared payer wallet and transaction signature.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [payer_wallet, transaction_signature]
