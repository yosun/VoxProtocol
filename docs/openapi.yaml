              additionalProperties: false
      responses:
        '200':
          description: Idempotent retry returned the accepted quote and existing payment intent
          content:
            application/json:
              schema:
                type: object
        '201':
          description: Accepted quote, payment intent, and exact USDC funding instructions
          content:
            application/json:
              schema:
                type: object
        '409':
          description: Quote expired or no longer matches the active rights and settlement configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/realize/commissions/{commissionId}/fund:
    parameters:
      - name: commissionId
