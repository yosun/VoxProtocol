          $ref: '#/components/schemas/HexDigest'
        envelope_hash:
          $ref: '#/components/schemas/HexDigest'
        leaf_hash:
          $ref: '#/components/schemas/HexDigest'
        leaf_index:
          type: integer
          minimum: 0
    BatchManifest:
      type: object
      required: [protocol, manifest_version, tree_version, authority_id, batch_id, epoch, ordering, record_count, first_sequence, last_sequence, root, created_at, leaves, manifest_hash]
      properties:
        protocol:
          const: vox/1
        manifest_version:
          const: 1
        tree_version:
          const: vox-merkle-v1
        authority_id:
          type: string
        batch_id:
          type: string
        epoch:
          type: string
          pattern: '^\\d{4}-\\d{2}-\\d{2}(?:T\\d{2})?Z$'
        ordering:
          const: agent_id,sequence,post_id
        record_count:
          type: integer
          minimum: 0
        first_sequence:
          anyOf:
            - type: integer
              minimum: 0
            - type: 'null'
        last_sequence:
          anyOf:
            - type: integer
              minimum: 0
            - type: 'null'
        root:
          $ref: '#/components/schemas/HexDigest'
        created_at:
          type: string
          format: date-time
        leaves:
          type: array
          items:
            $ref: '#/components/schemas/ManifestLeaf'
        manifest_hash:
          $ref: '#/components/schemas/HexDigest'
