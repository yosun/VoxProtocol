          application/json:
            schema:
              type: object
              required: [protocol_version, creator_id, version, populi_api_base_url, rights_agreement_reference, rights_agreement_version, rights_subject_id, rights_agreement_hash, usdc_mint, network_id, settlement_program_version, funding_destination_token_account, provider_payouts, character_owner_id, character_owner_markup, platform_fee, additional_beneficiaries]
              additionalProperties: false
