[package]
name = "realize-escrow"
version = "0.2.0"
edition = "2021"
rust-version = "1.89"
[lib]
crate-type = ["cdylib", "lib"]
name = "realize_escrow"
[features]
default = ["localnet"]
localnet = []
devnet = []
mainnet = []
no-entrypoint = []
cpi = ["no-entrypoint"]
no-idl = []
no-log-ix-name = []
anchor-debug = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
[dependencies]
anchor-lang = { version = "=1.2.1", default-features = false, features = ["solana-v4"] }
anchor-spl = { version = "=1.2.1", default-features = false, features = ["solana-v4", "token", "token_2022", "associated_token"] }
solana-sha256-hasher = "3"
solana-instructions-sysvar = "=4.0.0"
solana-sdk-ids = "=3.1.0"
[dev-dependencies]
proptest = "1.9"
litesvm = "=0.18.0"
solana-account = "4.3"
solana-instruction = "3.4"
solana-keypair = "3.1"
solana-signer = "3"
solana-message = "4.2"
solana-transaction = "4.1"
solana-program-option = "3"
serde_json = "1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))', 'cfg(feature, values("custom-heap", "custom-panic"))'] }
